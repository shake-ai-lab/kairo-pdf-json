const IDB_NAME = "kairo-review", IDB_STORE = "images";
let dbp = null;
function idb() {
  if (!dbp) dbp = new Promise((res, rej) => {

}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(IDB_STORE, mode); const req = fn(tx.objectStore(IDB_STORE));
    tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error);
  });
}

async function shrink(file) {
  try {
    const bmp = await createImageBitmap(file); const max = 2400;
    if (Math.max(bmp.width, bmp.height) <= max) return file;
    const k = max / Math.max(bmp.width, bmp.height), c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(r, "image/png"));
  } catch (e) { return file; }
}

    try { await idbDo("readwrite", s => s.put({blob, name: f.name || "pasted.png", type: blob.type || f.type}, imgKey(iid))); }
    catch (e) { $("msg").textContent = "画像を保存できませんでした（ブラウザの保存領域を確認してください）"; return; }
    const s = st[key] || (st[key] = {}); s.imgs = (s.imgs || []).concat(iid);
  }
  save(); fillThumbs(key); renderList();
}
async function removeImage(key, iid) {
  try { await idbDo("readwrite", s => s.delete(imgKey(iid))); } catch (e) {}
  st[key].imgs = (st[key].imgs || []).filter(x => x !== iid); save(); fillThumbs(key); renderList();
}
const urls = {};
async function fillThumbs(key) {
  const box = document.querySelector(".thumbs"); if (!box || cur !== key) return;
  box.innerHTML = "";
  for (const iid of (st[key] && st[key].imgs) || []) {
    let rec = null; try { rec = await idbDo("readonly", s => s.get(imgKey(iid))); } catch (e) {}
    if (!rec) continue;
    urls[iid] = urls[iid] || URL.createObjectURL(rec.blob);
    box.insertAdjacentHTML("beforeend", `<div class="thumb"><a href="${urls[iid]}" target="_blank"><img src="${urls[iid]}" alt="添付画像"></a><button type="button" data-rm="${iid}" title="削除">×</button></div>`);
  }
}

/* ---- list and detail ---- */
const label = v => v === "ok" ? ["正しい", "ok"] : v === "ng" ? ["違う", "ng"] : ["未確認", ""];
function renderList() {
  $("list").innerHTML = items().map(p => {
    const s = st[p.key] || {}; const [t, c] = label(s.v); const n = (s.imgs || []).length;
    return `<button class="pi${p.key === cur ? " sel" : ""}" data-key="${esc(p.key)}">
      <span class="tt">${esc(p.title)}</span><span class="badge ${c}">${t}${s.n || n ? " ✎" : ""}</span>
      <span class="sub">${esc(p.sub || "")}</span></button>`;
  }).join("");
  let all = 0, done = 0;
  for (const t of Object.keys(TABS)) {
    const d = DATA[t].filter(p => (st[p.key] || {}).v).length;
    $("cnt-" + t).textContent = `${d}/${DATA[t].length}`;
    all += DATA[t].length; done += d;
  }
  $("progress").textContent = `確認済み ${done} / ${all}`;
}
function renderDetail() {
  const p = find(cur); const s = st[cur] || {};
  $("detail").innerHTML = `<h2>${esc(p.title)} <small>${esc(p.sub || "")}</small></h2>
    ${p.steps.length ? `<ol class="flow">${p.steps.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
    ${p.html || ""}
    <ul class="meta${p.steps.length ? "" : " plain"}">${p.meta.filter(Boolean).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    <div class="verdict"><button class="ok${s.v === "ok" ? " on" : ""}" data-v="ok">正しい</button>
      <button class="ng${s.v === "ng" ? " on" : ""}" data-v="ng">違う</button>
      <button class="small-btn next" id="next">次へ →</button></div>
    <textarea id="note" placeholder="違う点・気づいたこと（画像は Ctrl+V で貼り付け、またはここへドラッグ）">${esc(s.n || "")}</textarea>
    <div class="thumbs"></div>
    <div style="margin-top:6px"><button class="small-btn" id="addimg">画像を追加</button></div>`;
  fillThumbs(cur);
  $("legend").innerHTML = p.legend.length
    ? p.legend.map(([n, c]) => `<span><i style="background:${c}"></i>${esc(n)}</span>`).join("")
    : `<span class="hint">オレンジの枠：選んだ項目の位置</span>`;
}
function select(key, scroll = true) {
  cur = key;
  $("sel").innerHTML = find(key).svg || "";
  renderList(); renderDetail();
  if (scroll) scrollToItem();
  const it = document.querySelector(`.pi[data-key="${CSS.escape(key)}"]`); if (it) it.scrollIntoView({block: "nearest"});
}
function scrollToItem() {
  const p = find(cur); if (!p.bbox) return;
  const vb = svg.viewBox.baseVal; const k = svg.clientWidth / vb.width, s = $("stage");
  const cx = ((p.bbox[0] + p.bbox[2]) / 2 - vb.x) * k, cy = ((p.bbox[1] + p.bbox[3]) / 2 - vb.y) * k;
  s.scrollTo({left: Math.max(0, cx - s.clientWidth / 2), top: Math.max(0, cy - s.clientHeight / 2), behavior: "smooth"});
}
function setTab(t, key) {
  tab = t;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
  select(key || items()[0].key);
}
function move(d) {
  const list = items(); const i = list.findIndex(x => x.key === cur);
  select(list[(i + d + list.length) % list.length].key);
}

$("tabs").addEventListener("click", e => { const b = e.target.closest("button[data-tab]"); if (b) setTab(b.dataset.tab); });
$("list").addEventListener("click", e => { const b = e.target.closest(".pi"); if (b) select(b.dataset.key); });
$("ctx").addEventListener("click", e => {
  const g = e.target.closest(".net"); if (!g) return;
  const hit = DATA.circuits.filter(c => c.nets.includes(g.dataset.net));
  if (hit.length) setTab("circuits", hit[0].key);
});
$("detail").addEventListener("click", e => {
  const vb = e.target.closest("button[data-v]");
  if (vb) { const s = st[cur] || (st[cur] = {}); s.v = s.v === vb.dataset.v ? undefined : vb.dataset.v; save(); renderList(); renderDetail(); return; }
  if (e.target.closest("#next")) {
    const all = Object.keys(TABS).flatMap(t => DATA[t].map(x => [t, x]));
    const i = all.findIndex(([, x]) => x.key === cur);
    const nxt = all.slice(i + 1).concat(all.slice(0, i)).find(([, x]) => !(st[x.key] || {}).v) || all[(i + 1) % all.length];
    setTab(nxt[0], nxt[1].key); return;
  }
  if (e.target.closest("#addimg")) { $("filepick").value = ""; $("filepick").click(); return; }
  const rm = e.target.closest("button[data-rm]"); if (rm) { e.preventDefault(); removeImage(cur, rm.dataset.rm); }
});
$("filepick").addEventListener("change", e => addImages(cur, e.target.files));
$("detail").addEventListener("input", e => { if (e.target.id === "note") { (st[cur] || (st[cur] = {})).n = e.target.value; save(); renderList(); } });
$("detail").addEventListener("paste", e => {
  const files = [...(e.clipboardData ? e.clipboardData.items : [])].filter(i => i.type.startsWith("image/")).map(i => i.getAsFile());
  if (files.length) { e.preventDefault(); addImages(cur, files); }
});
$("detail").addEventListener("dragover", e => { e.preventDefault(); $("detail").classList.add("drop"); });
$("detail").addEventListener("dragleave", () => $("detail").classList.remove("drop"));
$("detail").addEventListener("drop", e => { e.preventDefault(); $("detail").classList.remove("drop"); addImages(cur, e.dataTransfer.files); });
document.addEventListener("keydown", e => {
  if (e.target.closest("textarea, input")) return;
  if (e.key === "ArrowDown") { e.preventDefault(); move(1); }
  if (e.key === "ArrowUp") { e.preventDefault(); move(-1); }
});

/* ---- view controls ---- */
$("mode").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#mode button").forEach(x => x.classList.toggle("on", x === b));
  const overlay = b.dataset.mode === "overlay";
  svg.classList.toggle("overlay", overlay);
  $("fade").value = overlay ? 100 : 10; bg.setAttribute("opacity", $("fade").value / 100);
});
$("fade").addEventListener("input", () => bg.setAttribute("opacity", $("fade").value / 100));
$("zoom").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#zoom button").forEach(x => x.classList.toggle("on", x === b));
  svg.style.width = (100 * Number(b.dataset.z)) + "%"; setTimeout(scrollToItem, 50);
});
$("showctx").addEventListener("change", e => $("ctx").classList.toggle("hidden", !e.target.checked));
$("tags").addEventListener("change", e => svg.classList.toggle("notags", !e.target.checked));

/* ---- results ---- */
$("copy").onclick = async () => {
  const lines = [`${SAMPLE} p.${PAGE}「${TITLE}」正解データの確認結果`];
  for (const t of Object.keys(TABS)) {
    lines.push(`■ ${TABS[t]}`);
    for (const p of DATA[t]) {
      const s = st[p.key] || {}; const n = (s.imgs || []).length;
      lines.push(`- ${p.title}：${label(s.v)[0]}${s.n ? "：" + s.n.replace(/\n/g, " ") : ""}${n ? `（画像 ${n} 枚）` : ""}`);
    }
  }
  const text = lines.join("\n");
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
  $("msg").textContent = "コピーしました。画像はコピーに入らないので、画像を付けたときはファイルに保存してください。";
};
const toB64 = blob => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
$("export").onclick = async () => {
  const out_items = {};
  for (const p of Object.values(DATA).flat()) {
    const s = st[p.key] || {}; const images = [];
    for (const iid of s.imgs || []) {
      let rec = null; try { rec = await idbDo("readonly", x => x.get(imgKey(iid))); } catch (e) {}
      if (rec) images.push({id: iid, name: rec.name, type: rec.type, data: await toB64(rec.blob)});
    }
    if (s.v || s.n || images.length) out_items[p.key] = {title: p.title, verdict: s.v || null, note: s.n || "", images};
  }
  const now = new Date(), ts = now.toISOString().replace(/[-:]/g, "").slice(0, 15);
  const out = {kind: "kairo-review", sample_id: SAMPLE, page: PAGE, title: TITLE, saved_at: now.toISOString(), items: out_items};
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(out)], {type: "application/json"}));
  a.download = `review_${SAMPLE}_p${String(PAGE).padStart(3, "0")}_${ts}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  $("msg").textContent = `「${a.download}」を保存しました（通常はダウンロードフォルダ）。保存したことを Claude に伝えてください。`;
};

const m = location.hash.match(/(circuits|comps|others)=(.+)$/);
if (m && DATA[m[1]].some(x => x.key === decodeURIComponent(m[2]))) { tab = m[1]; setTab(m[1], decodeURIComponent(m[2])); }
else setTab("circuits");
</script>
</body>
</html>
