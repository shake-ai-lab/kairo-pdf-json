[project]
name = "kairo-pdf-json"
version = "0.1.0"
description = "PLC関連の電気回路図PDF（ベクター・ラスター）を構造化JSONに変換し、精度を評価する"
authors = [
    { name = "shake-ai-lab", email = "306678581+shake-ai-lab@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "pdfminer-six>=20260107",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
kairo = "kairo_pdf_json.cli:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# 編集の途中で「まだ使っていない import」が自動で消えないようにする（検出は ruff check で行う）
unfixable = ["F401"]
